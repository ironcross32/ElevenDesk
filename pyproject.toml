[project]
name = "elevendesk"
version = "1.0.0"
description = "An accessible wxPython desktop client for the ElevenLabs API."
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
	"elevenlabs>=2.70.0",
	"prismatoid>=0.18.2",
	"smart-list",
	"sound-lib>=0.83",
	"wxpython",
]

[project.gui-scripts]
elevendesk = "elevendesk.__main__:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["elevendesk"]

[tool.ruff]
target-version = "py313"

[tool.uv.sources]
smart-list = { git = "https://github.com/accessibleapps/smart_list" }

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
]
